<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080C14"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1035"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="waveGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".8"/><stop offset="50%" stop-color="#818CF8" stop-opacity=".5"/><stop offset="100%" stop-color="#C084FC" stop-opacity=".1"/></linearGradient><linearGradient id="waveGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34D399" stop-opacity=".1"/><stop offset="50%" stop-color="#38BDF8" stop-opacity=".6"/><stop offset="100%" stop-color="#F472B6" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatPulse{0%{transform:translateY(0) scale(1);opacity:.7}50%{transform:translateY(-8px) scale(1.08);opacity:1}}@keyframes waveOffset{0%{stroke-dashoffset:1000}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes beaconPulse{0%{r:4px;opacity:.9}50%{r:14px;opacity:.2}}.node-pulse{animation:floatPulse 4s ease-in-out infinite}.beacon{animation:beaconPulse 2.5s cubic-bezier(.4,0,.6,1) infinite}.wave-line1{stroke-dasharray:1200;animation:waveOffset 12s linear infinite}.wave-line2{stroke-dasharray:800;animation:waveOffset 8s linear infinite reverse}.title-text{font-weight:800;font-size:46px;fill:url(#textGrad)}.badge-text,.pill-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-text{font-weight:700;font-size:13px;letter-spacing:2px;fill:#38bdf8}.subtitle-text{font-weight:500;font-size:17px;fill:#94a3b8}.pill-text{font-weight:600;font-size:12px;fill:#f1f5f9}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><g opacity=".6"><path fill="none" stroke="url(#waveGrad1)" stroke-width="3.5" d="M -50 280 Q 150 180 350 250 T 750 200 T 1150 270 T 1300 210" class="wave-line1" filter="url(#glow)"/><path fill="none" stroke="url(#waveGrad2)" stroke-width="2.5" d="M -50 320 Q 200 370 450 300 T 850 330 T 1250 280" class="wave-line2"/><g class="node-pulse" transform="translate(350, 250)"><circle cx="0" cy="0" r="12" fill="#38BDF8" fill-opacity=".15"/><circle cx="0" cy="0" r="5" fill="#38BDF8" filter="url(#subtleGlow)"/></g><g class="node-pulse" transform="translate(750, 200)" style="animation-delay:1.5s"><circle cx="0" cy="0" r="14" fill="#818CF8" fill-opacity=".15"/><circle cx="0" cy="0" r="6" fill="#818CF8" filter="url(#subtleGlow)"/></g><g class="node-pulse" transform="translate(1000, 310)" style="animation-delay:.8s"><circle cx="0" cy="0" r="10" fill="#F472B6" fill-opacity=".15"/><circle cx="0" cy="0" r="4" fill="#F472B6" filter="url(#subtleGlow)"/></g><g transform="translate(1080, 110)"><circle cx="0" cy="0" r="45" fill="none" stroke="#38BDF8" stroke-opacity=".15" stroke-width="1"/><circle cx="0" cy="0" r="25" fill="none" stroke="#38BDF8" stroke-opacity=".25" stroke-width="1"/><circle cx="0" cy="0" r="4" fill="#38BDF8" class="beacon"/></g></g><g><g transform="translate(70, 75) translate(0, 0)"><rect width="310" height="30" 