<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Wave Line Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-8px) scale(1.08); opacity: 1; }
      }
      @keyframes waveOffset {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconPulse {
        0% { r: 4px; opacity: 0.9; }
        50% { r: 14px; opacity: 0.2; }
        100% { r: 4px; opacity: 0.9; }
      }
      .node-pulse { animation: floatPulse 4s ease-in-out infinite; }
      .beacon { animation: beaconPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .wave-line1 {
        stroke-dasharray: 1200;
        animation: waveOffset 12s linear infinite;
      }
      .wave-line2 {
        stroke-dasharray: 800;
        animation: waveOffset 8s linear infinite reverse;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#textGrad);
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 2px;
        fill: #38BDF8;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94A3B8;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #F1F5F9;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Animated Background Wave Graphics (Under Text) -->
  <g opacity="0.6">
    <!-- Telemetry Wave Line 1 -->
    <path class="wave-line1" d="M -50 280 Q 150 180 350 250 T 750 200 T 1150 270 T 1300 210" fill="none" stroke="url(#waveGrad1)" stroke-width="3.5" filter="url(#glow)" />
    
    <!-- Telemetry Wave Line 2 -->
    <path class="wave-line2" d="M -50 320 Q 200 370 450 300 T 850 330 T 1250 280" fill="none" stroke="url(#waveGrad2)" stroke-width="2.5" />

    <!-- Animated Data Nodes (Telemetry Points) -->
    <g transform="translate(350, 250)" class="node-pulse">
      <circle cx="0" cy="0" r="12" fill="#38BDF8" fill-opacity="0.15" />
      <circle cx="0" cy="0" r="5" fill="#38BDF8" filter="url(#subtleGlow)" />
    </g>

    <g transform="translate(750, 200)" class="node-pulse" style="animation-delay: 1.5s;">
      <circle cx="0" cy="0" r="14" fill="#818CF8" fill-opacity="0.15" />
      <circle cx="0" cy="0" r="6" fill="#818CF8" filter="url(#subtleGlow)" />
    </g>

    <g transform="translate(1000, 310)" class="node-pulse" style="animation-delay: 0.8s;">
      <circle cx="0" cy="0" r="10" fill="#F472B6" fill-opacity="0.15" />
      <circle cx="0" cy="0" r="4" fill="#F472B6" filter="url(#subtleGlow)" />
    </g>

    <!-- Radar Beacon in Bottom Right -->
    <g transform="translate(1080, 110)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="0" cy="0" r="4" class="beacon" fill="#38BDF8" />
    </g>
  </g>

  <!-- Foreground Content Layer (Text & Badges Clearly Positioned Above Animations) -->
  <g transform="translate(70, 75)">
    <!-- Top Category Badge Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="18" cy="15" r="4" fill="#38BDF8" filter="url(#subtleGlow)" />
      <text x="32" y="20" class="badge-text">DIGITAL EXPERIENCE MONITORING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title-text" filter="url(#subtleGlow)">Awesome Digital Experience</text>
    <text x="0" y="150" class="title-text" filter="url(#subtleGlow)">Monitoring Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">
      Real User Monitoring (RUM) • Synthetic Probing • Digital Employee Experience (DEX) • IPM
    </text>

    <!-- Capability Pills (Foreground Footer Elements) -->
    <g transform="translate(0, 225)">
      <!-- Pill 1: RUM -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="115" height="32" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" class="pill-text">⚡ Client RUM</text>
      </g>

      <!-- Pill 2: Synthetics -->
      <g transform="translate(127, 0)">
        <rect x="0" y="0" width="145" height="32" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" class="pill-text">🎯 Synthetic Probes</text>
      </g>

      <!-- Pill 3: DEX -->
      <g transform="translate(284, 0)">
        <rect x="0" y="0" width="135" height="32" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" class="pill-text">💻 Endpoint DEX</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(431, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#1E293B" fill-opacity="0.9" stroke="#34D399" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" class="pill-text">🌐 Open-Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
